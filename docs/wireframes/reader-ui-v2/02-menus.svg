  <rect x="210" y="572" width="380" height="6" rx="3" fill="#E1E4E8"/>
  <rect x="210" y="572" width="160" height="6" rx="3" fill="#1A73E8"/>
  <circle cx="370" cy="575" r="8" fill="#1A73E8"/>
  <text x="450" y="600" font-size="12" fill="#5F6368" text-anchor="middle">42% · 位置 1304/3120</text>
