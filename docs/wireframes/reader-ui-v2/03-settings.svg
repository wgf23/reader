<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="640" fill="#FAFAFA"/>
  <text x="24" y="26" font-size="11" fill="#5F6368">阅读器 · 交互原型 v2</text>
  <text x="450" y="26" font-size="16" font-weight="bold" fill="#202124" text-anchor="middle">Aa 显示设置面板（底部弹层）</text>

  <!-- 背景正文淡化 -->
  <g stroke="#C4C9CF" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <line x1="120" y1="80" x2="780" y2="80"/><line x1="120" y1="110" x2="700" y2="110"/>
    <line x1="120" y1="140" x2="640" y2="140"/><line x1="120" y1="170" x2="760" y2="170"/>
  </g>

  <!-- 底部设置面板（占据下半屏） -->
  <rect x="0" y="240" width="900" height="400" fill="#FFFFFF" stroke="#E1E4E8" stroke-width="1"/>
  <text x="32" y="286" font-size="15" font-weight="bold" fill="#202124">显示设置</text>
  <text x="868" y="286" font-size="14" fill="#5F6368" text-anchor="end">✕</text>

  <!-- 字号 -->
  <text x="32" y="338" font-size="14" fill="#202124">字号</text>
  <text x="120" y="338" font-size="12" fill="#5F6368">A-</text>
  <rect x="160" y="328" width="380" height="6" rx="3" fill="#E1E4E8"/>
  <rect x="160" y="328" width="200" height="6" rx="3" fill="#1A73E8"/>
  <circle cx="300" cy="331" r="8" fill="#1A73E8"/>
  <text x="560" y="338" font-size="14" fill="#1A73E8">A+</text>
  <text x="620" y="338" font-size="13" fill="#5F6368">18 pt</text>

  <!-- 字体 -->
  <text x="32" y="388" font-size="14" fill="#202124">字体</text>
  <rect x="120" y="370" width="120" height="30" rx="6" fill="#ECEEF1" stroke="#9AA0A6" stroke-width="1.2"/>
  <text x="180" y="390" font-size="12" fill="#202124" text-anchor="middle">系统默认</text>
  <rect x="250" y="370" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="295" y="390" font-size="12" fill="#1A73E8" text-anchor="middle">衬线</text>
  <rect x="350" y="370" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.2"/>
  <text x="395" y="390" font-size="12" fill="#202124" text-anchor="middle">无衬线</text>

  <!-- 主题 -->
  <text x="32" y="440" font-size="14" fill="#202124">主题</text>
  <rect x="120" y="424" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="165" y="444" font-size="12" fill="#1A73E8" text-anchor="middle">浅色</text>
  <rect x="220" y="424" width="90" height="30" rx="6" fill="#202124" stroke="#202124" stroke-width="1.5"/>
  <text x="265" y="444" font-size="12" fill="#FFFFFF" text-anchor="middle">深色</text>
  <rect x="320" y="424" width="90" height="30" rx="6" fill="#F5ECD9" stroke="#9AA0A6" stroke-width="1.2"/>
  <text x="365" y="444" font-size="12" fill="#3B2F1F" text-anchor="middle">护眼</text>

  <!-- 行距 -->
  <text x="32" y="492" font-size="14" fill="#202124">行距</text>
  <rect x="120" y="476" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.2"/>
  <text x="165" y="496" font-size="12" fill="#202124" text-anchor="middle">紧凑</text>
  <rect x="220" y="476" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="265" y="496" font-size="12" fill="#1A73E8" text-anchor="middle">标准</text>
  <rect x="320" y="476" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.2"/>
  <text x="365" y="496" font-size="12" fill="#202124" text-anchor="middle">宽松</text>

  <!-- 翻页：模式切换（从右上角移除，移到这里） -->
  <text x="32" y="548" font-size="14" fill="#202124">翻页</text>
  <circle cx="130" cy="542" r="9" fill="#1A73E8"/>
  <text x="146" y="547" font-size="13" fill="#202124">分页模式</text>
  <circle cx="260" cy="542" r="9" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="276" y="547" font-size="13" fill="#5F6368">滚动模式</text>

  <!-- 说明 -->
  <text x="32" y="604" font-size="11" fill="#5F6368">交互：Aa 面板集中了字号/字体/主题/行距/翻页，替代原来右上角散乱的三个按钮；模式切换也在此</text>
</svg>
