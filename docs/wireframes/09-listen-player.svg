<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- ===== 顶部标题条 ===== -->
  <text x="60" y="24" font-size="12" fill="#5F6368">阅读器 · 低保真线框 v1</text>
  <text x="450" y="24" font-size="16" font-weight="bold" fill="#202124" text-anchor="middle">听书模式 · 跟读</text>
  <line x1="40" y1="40" x2="860" y2="40" stroke="#9AA0A6" stroke-width="1.5"/>

  <!-- ===== 正文上方注释（虚线框） ===== -->
  <rect x="60" y="54" width="780" height="26" rx="6" fill="none" stroke="#9AA0A6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="76" y="71" font-size="11" fill="#5F6368">听书与阅读共用同一进度，退出听书回到阅读同位置</text>

  <!-- ===== 正文区：18 行灰色短横线模拟文字（y=90..430） ===== -->
  <line x1="60" y1="104" x2="540" y2="104" stroke="#C4C9CF" stroke-width="3"/>
  <line x1="60" y1="123" x2="500" y2="123" stroke="#E1E4E8" stroke-width="3"/>
  <line x1="60" y1="142" x2="640" y2="142" stroke="#C4C9CF" stroke-width="3"/>
  <line x1="60" y1="161" x2="460" y2="161" stroke="#E1E4E8" stroke-width="3"/>
  <line x1="60" y1="180" x2="600" y2="180" stroke="#C4C9CF" stroke-width="3"/>
  <!-- 当前朗读句：y≈200 处，半透明蓝矩形覆盖 x=60..800 -->
  <line x1="60" y1="199" x2="800" y2="199" stroke="#C4C9CF" stroke-width="3"/>
  <rect x="60" y="191" width="740" height="16" rx="3" fill="rgba(26,115,232,0.25)"/>
  <rect x="784" y="189" width="52" height="22" rx="11" fill="#1A73E8"/>
  <text x="810" y="204" font-size="11" fill="#FFFFFF" text-anchor="middle">朗读中</text>
  <line x1="60" y1="218" x2="520" y2="218" stroke="#C4C9CF" stroke-width="3"/>
  <line x1="60" y1="237" x2="660" y2="237" stroke="#E1E4E8" stroke-width="3"/>
  <line x1="60" y1="256" x2="440" y2="256" stroke="#C4C9CF" stroke-width="3"/>
  <line x1="60" y1="275" x2="580" y2="275" stroke="#E1E4E8" stroke-width="3"/>
  <line x1="60" y1="294" x2="700" y2="294" stroke="#C4C9CF" stroke-width="3"/>
  <line x1="60" y1="313" x2="480" y2="313" stroke="#E1E4E8" stroke-width="3"/>
  <line x1="60" y1="332" x2="620" y2="332" stroke="#C4C9CF" stroke-width="3"/>
  <line x1="60" y1="351" x2="560" y2="351" stroke="#E1E4E8" stroke-width="3"/>
  <line x1="60" y1="370" x2="420" y2="370" stroke="#C4C9CF" stroke-width="3"/>
  <line x1="60" y1="389" x2="680" y2="389" stroke="#E1E4E8" stroke-width="3"/>
  <line x1="60" y1="408" x2="500" y2="408" stroke="#C4C9CF" stroke-width="3"/>
  <line x1="60" y1="427" x2="600" y2="427" stroke="#E1E4E8" stroke-width="3"/>

  <!-- ===== 底部听书控制条（白底描边圆角，x=40..860，y=450..610） ===== -->
  <rect x="40" y="450" width="820" height="160" rx="8" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.5"/>

  <!-- 第一行：章节名 -->
  <text x="450" y="482" font-size="15" font-weight="bold" fill="#202124" text-anchor="middle">第三章 · 起风了</text>

  <!-- 第二行：控制排（上一句 / 播放暂停 / 下一句） -->
  <circle cx="390" cy="527" r="20" fill="#FAFAFA" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="390" y="533" font-size="16" fill="#202124" text-anchor="middle">⏮</text>
  <circle cx="450" cy="527" r="30" fill="#1A73E8"/>
  <text x="450" y="534" font-size="20" fill="#FFFFFF" text-anchor="middle">⏸</text>
  <circle cx="510" cy="527" r="20" fill="#FAFAFA" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="510" y="533" font-size="16" fill="#202124" text-anchor="middle">⏭</text>

  <!-- 第三行：句级进度条 + 语速 -->
  <line x1="120" y1="565" x2="640" y2="565" stroke="#C4C9CF" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="565" x2="380" y2="565" stroke="#1A73E8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="380" cy="565" r="6.5" fill="#1A73E8"/>
  <text x="660" y="571" font-size="13" font-weight="bold" fill="#1A73E8">1.0x</text>

  <!-- 控制条右侧：竖排两个小按钮（定时 / 音色） -->
  <rect x="744" y="470" width="100" height="30" rx="6" fill="#FAFAFA" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="794" y="490" font-size="12" fill="#202124" text-anchor="middle">⏱ 30 分钟</text>
  <rect x="744" y="510" width="100" height="30" rx="6" fill="#FAFAFA" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="794" y="530" font-size="12" fill="#202124" text-anchor="middle">🎙 男声·AI</text>

  <!-- ===== 底部说明 ===== -->
  <text x="450" y="622" font-size="11" fill="#5F6368" text-anchor="middle">切到其他页面时收起为迷你播放条（跨页面常驻）；桌面可用 空格 暂停、←/→ 跳句</text>
</svg>
