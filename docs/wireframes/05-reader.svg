<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="640" fill="#FAFAFA"/>
  <!-- 顶部标题条 -->
  <text x="24" y="24" font-size="12" fill="#5F6368">阅读器 · 低保真线框 v1</text>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#202124">阅读器主界面</text>

  <!-- 顶栏 -->
  <rect x="0" y="32" width="900" height="48" fill="#ECEEF1" stroke="#9AA0A6" stroke-width="1.5"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="24" y="63" font-size="14" fill="#1A73E8">← 返回</text>
  <text x="450" y="63" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">百年孤独</text>
  <text x="760" y="62" text-anchor="middle" font-size="15" fill="#1A73E8">☰</text>
  <text x="760" y="77" text-anchor="middle" font-size="11" fill="#5F6368">目录</text>
  <text x="815" y="62" text-anchor="middle" font-size="15" fill="#1A73E8">⌕</text>
  <text x="815" y="77" text-anchor="middle" font-size="11" fill="#5F6368">搜索</text>
  <text x="870" y="62" text-anchor="middle" font-size="15" fill="#1A73E8">⚙</text>
  <text x="870" y="77" text-anchor="middle" font-size="11" fill="#5F6368">设置</text>

  <!-- 左右翻页区（60px 边距） -->
  <rect x="0" y="80" width="60" height="480" fill="none" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text transform="rotate(-90 30 320)" x="30" y="320" text-anchor="middle" font-size="12" fill="#5F6368">◀ 点击翻页</text>
  <rect x="840" y="80" width="60" height="480" fill="none" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text transform="rotate(-90 870 320)" x="870" y="320" text-anchor="middle" font-size="12" fill="#5F6368">点击翻页 ▶</text>

  <!-- 正文占位（18 行灰色短横线） -->
  <line x1="60" y1="104" x2="840" y2="104" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="128" x2="700" y2="128" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="152" x2="820" y2="152" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="176" x2="540" y2="176" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="200" x2="800" y2="200" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="224" x2="740" y2="224" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="248" x2="830" y2="248" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="272" x2="700" y2="272" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="296" x2="780" y2="296" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="320" x2="660" y2="320" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="344" x2="720" y2="344" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="368" x2="780" y2="368" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="392" x2="700" y2="392" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="416" x2="740" y2="416" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="440" x2="660" y2="440" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="464" x2="760" y2="464" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="488" x2="720" y2="488" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="512" x2="700" y2="512" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>

  <!-- 已存在的高亮笔记（覆盖 3 行） -->
  <rect x="60" y="248" width="780" height="72" fill="rgba(26,115,232,0.25)" stroke="#1A73E8" stroke-width="1"/>
  <rect x="792" y="254" width="48" height="20" rx="3" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1"/>
  <text x="816" y="267" text-anchor="middle" font-size="11" fill="#1A73E8">笔记</text>

  <!-- 交互注释 -->
  <rect x="560" y="336" width="280" height="42" rx="4" fill="#FFFFFF" fill-opacity="0.85" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="572" y="352" font-size="11" fill="#5F6368">已存在的高亮笔记</text>
  <text x="572" y="368" font-size="11" fill="#5F6368">点击可查看 / 编辑批注</text>

  <rect x="60" y="430" width="470" height="42" rx="4" fill="#FFFFFF" fill-opacity="0.85" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="72" y="446" font-size="11" fill="#5F6368">分页模式：点击左右边缘翻页（左回右进）</text>
  <text x="72" y="462" font-size="11" fill="#5F6368">支持触控滑动翻页与键盘方向键</text>

  <!-- 底部进度条 -->
  <line x1="60" y1="572" x2="780" y2="572" stroke="#9AA0A6" stroke-width="2"/>
  <line x1="60" y1="572" x2="362" y2="572" stroke="#1A73E8" stroke-width="3"/>
  <circle cx="362" cy="572" r="5" fill="#1A73E8"/>
  <text x="800" y="576" font-size="12" fill="#5F6368">42%</text>

  <!-- 底部交互说明 -->
  <text x="24" y="604" font-size="11" fill="#5F6368">主要交互点：点击左右边缘翻页（左回右进）；触控滑动 / 键盘 ←→ 翻页；顶栏 ☰ 目录 · ⌕ 搜索 · ⚙ 设置；点击高亮笔记查看批注</text>
</svg>
