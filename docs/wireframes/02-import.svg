  <line x1="180" y1="442" x2="860" y2="442" stroke="#E1E4E8" stroke-width="1.5"/>
  <!-- 行 3：失败 -->
  <text x="180" y="478" font-size="14" fill="#202124">三体.mobi</text>
  <rect x="310" y="466" width="48" height="20" rx="6" fill="#E1E4E8" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="334" y="480" font-size="11" fill="#5F6368" text-anchor="middle">MOBI</text>
  <rect x="390" y="476" width="300" height="8" rx="4" fill="#E1E4E8"/>
  <rect x="390" y="476" width="120" height="8" rx="4" fill="#1A73E8"/>
  <text x="840" y="480" font-size="13" fill="#D93025" text-anchor="end">失败</text>
  <line x1="180" y1="512" x2="860" y2="512" stroke="#E1E4E8" stroke-width="1.5"/>
  <!-- 交互注释 -->
  <rect x="180" y="520" width="560" height="52" rx="6" fill="none" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="196" y="540" font-size="11" fill="#5F6368">导入在后台进行，不阻塞界面</text>
  <text x="196" y="560" font-size="11" fill="#5F6368">重复文件按内容指纹去重</text>
  <!-- 底部汇总条 -->
  <rect x="150" y="580" width="600" height="34" rx="8" fill="#ECEEF1" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="450" y="602" font-size="13" fill="#202124" text-anchor="middle">导入完成：2 本完成 · 1 本失败（<tspan fill="#D93025">重试</tspan>）</text>
  <!-- 底部交互说明 -->
  <text x="450" y="628" font-size="11" fill="#5F6368" text-anchor="middle">交互：拖拽文件到虚线区或点击选择文件；导入在后台进行不阻塞界面；失败项可在汇总条点击「重试」</text>
</svg>
