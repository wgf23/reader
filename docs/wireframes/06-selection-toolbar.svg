<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="100%" font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="900" height="640" fill="#FAFAFA"/>
  <!-- 顶部标题条 -->
  <text x="24" y="24" font-size="12" fill="#5F6368">阅读器 · 低保真线框 v1</text>
  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#202124">文本选择与浮动工具条</text>

  <!-- 顶栏简化为一条灰线 -->
  <line x1="0" y1="50" x2="900" y2="50" stroke="#9AA0A6" stroke-width="1.5"/>

  <!-- 交互注释：工具条定位 -->
  <rect x="60" y="58" width="300" height="40" rx="4" fill="#FFFFFF" fill-opacity="0.85" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="72" y="74" font-size="11" fill="#5F6368">浮动工具条随选中区域</text>
  <text x="72" y="90" font-size="11" fill="#5F6368">自动定位，不遮挡正文</text>

  <!-- 正文占位（18 行灰色短横线） -->
  <line x1="60" y1="104" x2="820" y2="104" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="128" x2="700" y2="128" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="152" x2="760" y2="152" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="176" x2="480" y2="176" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="200" x2="740" y2="200" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="224" x2="780" y2="224" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="248" x2="620" y2="248" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="272" x2="640" y2="272" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="296" x2="840" y2="296" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="320" x2="840" y2="320" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="344" x2="840" y2="344" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="368" x2="700" y2="368" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="392" x2="520" y2="392" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="416" x2="560" y2="416" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="440" x2="780" y2="440" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="464" x2="640" y2="464" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="488" x2="720" y2="488" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="512" x2="780" y2="512" stroke="#C4C9CF" stroke-width="3" stroke-linecap="round"/>

  <!-- 选中文本块（3 行） -->
  <rect x="60" y="296" width="780" height="72" fill="rgba(26,115,232,0.25)" stroke="#1A73E8" stroke-width="1"/>

  <!-- 选区手柄（两端蓝色圆点） -->
  <circle cx="60" cy="296" r="6" fill="#1A73E8"/>
  <circle cx="60" cy="296" r="2.5" fill="#FFFFFF"/>
  <circle cx="840" cy="368" r="6" fill="#1A73E8"/>
  <circle cx="840" cy="368" r="2.5" fill="#FFFFFF"/>

  <!-- 浮动工具条（白底蓝描边圆角矩形） -->
  <rect x="200" y="236" width="500" height="40" rx="8" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5"/>
  <line x1="300" y1="244" x2="300" y2="268" stroke="#E1E4E8" stroke-width="1.5"/>
  <line x1="400" y1="244" x2="400" y2="268" stroke="#E1E4E8" stroke-width="1.5"/>
  <line x1="500" y1="244" x2="500" y2="268" stroke="#E1E4E8" stroke-width="1.5"/>
  <line x1="600" y1="244" x2="600" y2="268" stroke="#E1E4E8" stroke-width="1.5"/>
  <text x="250" y="260" text-anchor="middle" font-size="13" fill="#202124">复制</text>
  <text x="350" y="260" text-anchor="middle" font-size="13" fill="#202124">高亮</text>
  <circle cx="335" cy="270" r="2.5" fill="#F9AB00"/>
  <circle cx="345" cy="270" r="2.5" fill="#1A73E8"/>
  <circle cx="355" cy="270" r="2.5" fill="#34A853"/>
  <circle cx="365" cy="270" r="2.5" fill="#F06292"/>
  <text x="450" y="260" text-anchor="middle" font-size="13" fill="#202124">划线</text>
  <text x="550" y="260" text-anchor="middle" font-size="13" fill="#202124">批注</text>
  <text x="650" y="260" text-anchor="middle" font-size="13" fill="#1A73E8">翻译</text>

  <!-- 指向选中文本的小三角 -->
  <path d="M 438 276 L 462 276 L 450 286 Z" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 交互注释：翻译入口 -->
  <rect x="706" y="236" width="170" height="40" rx="4" fill="#FFFFFF" fill-opacity="0.85" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="718" y="252" font-size="11" fill="#5F6368">点「翻译」直接触发</text>
  <text x="718" y="268" font-size="11" fill="#5F6368">选句翻译（整句译文）</text>

  <!-- 交互注释：手柄 -->
  <rect x="700" y="392" width="176" height="28" rx="4" fill="#FFFFFF" fill-opacity="0.85" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="712" y="410" font-size="11" fill="#5F6368">拖动蓝色手柄调整选区</text>

  <!-- 底部交互说明 -->
  <text x="24" y="604" font-size="11" fill="#5F6368">主要交互点：长按或双击选中文本；拖动两端蓝色手柄调整选区；浮动工具条随选区移动；复制 / 高亮（四色）/ 划线 / 批注 / 翻译</text>
</svg>
