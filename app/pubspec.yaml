name: reader_app
description: 跨平台电子书阅读器（Flutter 壳）
publish_to: 'none'
version: 0.6.1+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 桥接（版本与 flutter_rust_bridge_codegen 对齐）
  flutter_rust_bridge: 2.13.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0
  # REQ-001：WebView 分页渲染（docs/02 §4.1，ADR-001）
  flutter_inappwebview: ^6.1.5

  # P0 按需启用（设计见 docs/02-technical.md §8）：
  # riverpod: ^2
  # go_router: ^12
  # window_manager: ^0.4
  # shared_preferences: ^2

  # 听书（P1，见 docs/02-technical.md §11）：
  # flutter_tts: ^4
  # just_audio: ^0.9
  # audio_service: ^0.18

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
