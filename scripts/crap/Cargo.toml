[package]
name = "crap"
version = "0.1.0"
edition = "2021"
description = "自研 CRAP 评分工具：圈复杂度 × 覆盖率 × 重复惩罚（docs/07 §5）"

[[bin]]
name = "crap"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
toml = "0.8"

[profile.release]
lto = true
strip = true
